<!doctype html><html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favela Llog • Portal do Motorista</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:radial-gradient(circle at 80% 0,#073b3d 0,transparent 38%),linear-gradient(160deg,#050b0d,#07191b 55%,#020607);color:#f5ffff;min-height:100svh;display:grid;place-items:center;overflow:hidden}body:before,body:after{content:"";position:fixed;background:#11d7cf;opacity:.17;filter:blur(1px);transform:rotate(-16deg)}body:before{width:55vw;height:12px;top:9%;right:-8%}body:after{width:75vw;height:16px;bottom:8%;left:-18%}.shell{width:min(92vw,430px);position:relative}.logo{text-align:center;margin-bottom:22px}.crown{font-size:58px;color:#16d9d1;line-height:.7}.favela{font-size:48px;font-weight:1000;font-style:italic;letter-spacing:-4px}.llog{font-size:42px;font-weight:1000;font-style:italic;color:#16d9d1;margin-top:-15px}.sub{letter-spacing:.35em;font-size:12px;margin-top:8px}.box{padding:25px;border:1px solid #1a4a4c;border-radius:22px;background:#061315e8;box-shadow:0 28px 90px #000b;backdrop-filter:blur(14px)}.field{position:relative;margin:12px 0}input{width:100%;height:54px;border-radius:13px;border:1px solid #315255;background:#071316;color:white;padding:0 16px;font-size:16px;outline:0}input:focus{border-color:#14d9d0;box-shadow:0 0 0 3px #14d9d018}.eye{position:absolute;right:7px;top:7px;height:40px;border:0;border-radius:9px;background:#10282a;color:#bce8e5}.enter{width:100%;height:54px;margin-top:10px;border:0;border-radius:13px;background:linear-gradient(90deg,#11cfc8,#21e5db);font-weight:1000;color:#032123;font-size:16px}.err{padding:11px;border-radius:10px;background:#4b171b;color:#ffc4c7;font-size:13px}.foot{text-align:center;color:#88a8a8;font-size:12px;margin-top:18px}</style></head><body><div class="shell"><div class="logo"><div class="crown">♕</div><div class="favela">FAVELA</div><div class="llog">LLOG</div><div class="sub">SDA9 • PORTAL DO MOTORISTA</div></div><div class="box">{% if erro %}<div class="err">{{erro}}</div>{% endif %}<form method="post"><div class="field"><input name="usuario" placeholder="Usuário" autocomplete="username" required></div><div class="field"><input id="senha" type="password" name="senha" placeholder="Senha" autocomplete="current-password" required><button class="eye" type="button" onclick="senha.type=senha.type==='password'?'text':'password';this.textContent=senha.type==='password'?'Ver':'Ocultar'">Ver</button></div><button class="enter">ENTRAR</button></form><div class="foot">Acesso exclusivo para motoristas • Favela Llog</div></div></div></body></html>
