<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDA9 • Motorista</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#071317;color:#eef9f8;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,420px);padding:34px;border:1px solid #18373a;border-radius:24px;background:#0c1d20;box-shadow:0 30px 80px #0008}.brand{color:#26d6c4;font-weight:900;letter-spacing:.12em}h1{margin:10px 0 6px;font-size:30px}p{color:#9bb3b2}label{display:block;margin:18px 0 7px;font-size:13px}.pw{position:relative}input{width:100%;height:50px;border-radius:13px;border:1px solid #24484b;background:#081619;color:white;padding:0 14px;font-size:16px}.pw input{padding-right:62px}.pw button{position:absolute;right:7px;top:7px;height:36px;border:0;border-radius:9px;background:#173437;color:#c9f5ef}button[type=submit]{width:100%;height:50px;margin-top:22px;border:0;border-radius:13px;background:#20cdbb;font-weight:900;color:#032522}.err{color:#ff9b9b}</style><div class="box"><div class="brand">FAVELA LLOG • SDA9</div><h1>Portal do Motorista</h1><p>Acompanhe sua produção e sua folha.</p>{% if erro %}<p class="err">{{erro}}</p>{% endif %}<form method="post"><label>Usuário</label><input name="usuario" autocomplete="username" required><label>Senha</label><div class="pw"><input id="senha" type="password" name="senha" autocomplete="current-password" required><button type="button" onclick="senha.type=senha.type==='password'?'text':'password';this.textContent=senha.type==='password'?'Ver':'Ocultar'">Ver</button></div><button type="submit">ENTRAR</button></form></div>
