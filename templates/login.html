<!doctype html><html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Favela Llog • Portal</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff;background:#020809}body{min-height:100svh;background:#020809 url('/static/login_portal.png.jpeg?v=20') center top/auto 100% no-repeat fixed}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:0 16px}.login{width:min(68vw,350px);margin-top:26vh}.box{padding:16px 18px 17px;border-radius:22px;background:#031416e8;border:1px solid #16d8d2;box-shadow:0 15px 50px #000b;backdrop-filter:blur(8px)}input{width:100%;height:55px;margin:6px 0;border:1px solid #779092;border-radius:12px;background:#061518e8;color:#fff;padding:0 16px;font-size:16px;outline:none}input:focus{border-color:#16e1da}.pw{position:relative}.pw input{padding-right:55px}.pw button{position:absolute;right:8px;top:14px;height:40px;border:0;background:none;color:#eaffff;font-size:18px}.enter{height:55px;width:100%;border:0;border-radius:12px;margin-top:9px;background:#16ddd6;color:#021718;font-size:18px;font-weight:1000}.err{background:#49191dcc;color:#ffd0d2;padding:10px;border-radius:10px;margin-bottom:7px}.foot{text-align:center;color:#d7eeee;font-size:12px;margin-top:15px;line-height:1.35}
@media(max-width:430px){body{background-size:auto 100svh}.screen{align-items:flex-start;padding-top:48.5vh}.login{width:74vw;margin-top:0}.box{padding:13px 15px 14px}input{height:50px}.enter{height:51px}.foot{font-size:11px;margin-top:12px}}
@media(min-aspect-ratio:3/4){body{background-size:cover}.login{margin-top:25vh}}
</style></head><body><main class="screen"><section class="login"><div class="box">{% if erro %}<div class="err">{{erro}}</div>{% endif %}<form method="post"><input name="usuario" placeholder="♙  Usuário" required autocomplete="username"><div class="pw"><input id="senha" type="password" name="senha" placeholder="▣  Senha" required autocomplete="current-password"><button type="button" aria-label="Mostrar senha" onclick="senha.type=senha.type==='password'?'text':'password'">◉</button></div><button class="enter">↪ &nbsp; ENTRAR</button></form><div class="foot">Acesso exclusivo para motoristas<br>Favela Llog</div></div></section></main></body></html>
