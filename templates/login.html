<!doctype html><html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Favela Llog • Portal</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff;background:#02090a}body{min-height:100svh;background:linear-gradient(180deg,#00101244,#00101266),url('/static/fundo.webp?v=30') center/cover fixed no-repeat}.screen{min-height:100svh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px}.brand{width:min(86vw,360px);text-align:center;margin-bottom:20px}.brand img{display:block;width:100%;max-height:290px;object-fit:contain;filter:drop-shadow(0 10px 24px #000)}.brand .sda{font-weight:900;letter-spacing:.28em;margin-top:4px}.brand .portal{font-size:11px;letter-spacing:.34em;margin-top:7px}.box{width:min(100%,390px);padding:20px;border-radius:22px;background:#041416e8;border:1px solid #2f5c60;box-shadow:0 20px 65px #000c;backdrop-filter:blur(10px)}input{width:100%;height:56px;margin:7px 0;border:1px solid #60787b;border-radius:13px;background:#071619e8;color:#fff;padding:0 16px;font-size:16px;outline:0}input:focus{border-color:#16ddd6}.pw{position:relative}.pw input{padding-right:56px}.pw button{position:absolute;right:8px;top:15px;height:40px;border:0;background:none;color:#eaffff;font-size:18px}.enter{height:56px;width:100%;border:0;border-radius:13px;margin-top:10px;background:#16ddd6;color:#021718;font-size:18px;font-weight:1000}.err{background:#49191dcc;color:#ffd0d2;padding:10px;border-radius:10px;margin-bottom:8px}.foot{text-align:center;color:#d0dddd;font-size:12px;margin-top:16px;line-height:1.35}
