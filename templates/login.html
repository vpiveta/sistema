<!doctype html><html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Favela Llog • Portal</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff;background:#020809}body{min-height:100svh;background:linear-gradient(#00101244,#00101266),url('/static/fundo.jpg') center/cover fixed}.screen{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:24px}.logo{text-align:center;text-shadow:0 4px 15px #000;margin-bottom:25px}.crown{font-size:58px;color:#14dcd4}.fav{font-size:58px;line-height:.75;font-weight:1000;font-style:italic;letter-spacing:-5px}.ll{font-size:50px;font-weight:1000;font-style:italic;color:#18ddd5}.sda{margin-top:15px;letter-spacing:.28em;font-weight:800}.portal{font-size:11px;letter-spacing:.35em;margin-top:7px}.box{width:min(100%,390px);margin:0 auto;padding:20px;border-radius:20px;background:#071416e8;border:1px solid #315255;box-shadow:0 20px 70px #000c;backdrop-filter:blur(12px)}input{width:100%;height:56px;margin:7px 0;border:1px solid #526466;border-radius:12px;background:#091619dd;color:white;padding:0 16px;font-size:16px}.pw{position:relative}.pw input{padding-right:70px}.pw button{position:absolute;right:8px;top:15px;height:40px;border:0;background:none;color:#d8ffff}.enter{height:55px;width:100%;border:0;border-radius:12px;margin-top:10px;background:#18dcd4;color:#021718;font-size:17px;font-weight:1000}.err{background:#45191d;color:#ffc8ca;padding:10px;border-radius:10px;margin-bottom:8px}.foot{text-align:center;color:#c1cece;font-size:12px;margin-top:17px}</style></head><body><div class="screen"><div class="logo"><div class="crown">♕</div><div class="fav">FAVELA</div><div class="ll">LLOG</div><div class="sda">SDA9</div><div class="portal">PORTAL DO MOTORISTA</div></div><div class="box">{% if erro %}<div class="err">{{erro}}</div>{% endif %}<form method="post"><input name="usuario" placeholder="◯  Usuário" required autocomplete="username"><div class="pw"><input id="senha" type="password" name="senha" placeholder="▣  Senha" required autocomplete="current-password"><button type="button" onclick="senha.type=senha.type==='password'?'text':'password'">◉</button></div><button class="enter">↪ &nbsp; ENTRAR</button></form><div class="foot">Acesso exclusivo para motoristas<br>Favela Llog</div></div></div></body></html>
